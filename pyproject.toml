[project]
name = "shinnku-bot"
version = "0.1.0"
description = "A Telegram bot that talks like its owner"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "openai>=3.49.0",
    "fastembed>=0.9.1",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "pillow>=13.0.0",
    "huggingface-hub>=1.33.0",
]

[project.scripts]
shinnku = "shinnku_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shinnku_bot"]

[tool.uv]
dev-dependencies = []

[tool.black]
line-length = 88
target-version = ['py313']
